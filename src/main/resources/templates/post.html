<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Management</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">Post Management</h1>
    <div class="card mt-4">
        <div class="card-header">Create Post</div>
        <div class="card-body">
            <form id="create-post-form">
                <div class="form-group">
                    <label for="userId">User ID:</label>
                    <input type="number" class="form-control" id="create-user-id" required>
                </div>
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" class="form-control" id="create-title" required>
                </div>
                <div class="form-group">
                    <label for="content">Content:</label>
                    <textarea class="form-control" id="create-content" required></textarea>
                </div>
                <button type="button" class="btn btn-primary" onclick="createPost()">Create</button>
            </form>
        </div>
    </div>
    <div class="card mt-4">
        <div class="card-header">View Post</div>
        <div class="card-body">
            <form id="view-post-form">
                <div class="form-group">
                    <label for="postId">Post ID:</label>
                    <input type="number" class="form-control" id="view-post-id" required>
                </div>
                <button type="button" class="btn btn-info" onclick="viewPost()">View</button>
            </form>
            <div id="post-detail" class="mt-3"></div>
            <div id="like-section" class="mt-3" style="display: none;">
                <button class="btn btn-success" onclick="likePost()">Like</button>
                <p id="like-count" class="mt-2">Likes: 0</p>
            </div>
        </div>
    </div>
    <div class="card mt-4">
        <div class="card-header">Update Post</div>
        <div class="card-body">
            <form id="update-post-form">
                <div class="form-group">
                    <label for="userId">User ID:</label>
                    <input type="number" class="form-control" id="update-user-id" required>
                </div>
                <div class="form-group">
                    <label for="postId">Post ID:</label>
                    <input type="number" class="form-control" id="update-post-id" required>
                </div>
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" class="form-control" id="update-title" required>
                </div>
                <div class="form-group">
                    <label for="content">Content:</label>
                    <textarea class="form-control" id="update-content" required></textarea>
                </div>
                <button type="button" class="btn btn-warning" onclick="updatePost()">Update</button>
            </form>
        </div>
    </div>
    <div class="card mt-4">
        <div class="card-header">Delete Post</div>
        <div class="card-body">
            <form id="delete-post-form">
                <div class="form-group">
                    <label for="userId">User ID:</label>
                    <input type="number" class="form-control" id="delete-user-id" required>
                </div>
                <div class="form-group">
                    <label for="postId">Post ID:</label>
                    <input type="number" class="form-control" id="delete-post-id" required>
                </div>
                <button type="button" class="btn btn-danger" onclick="deletePost()">Delete</button>
            </form>
        </div>
    </div>
</div>
<div class="text-center my-4">
    <button class="btn btn-secondary" onclick="navigateToUserPage()">Go to User Management</button>
</div>
<div class="card mt-4">
    <div class="card-header">Post List</div>
    <div class="card-body">
        <button class="btn btn-info mb-3" onclick="fetchPostList()">Refresh List</button>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Content</th>
                <th>Likes</th>
            </tr>
            </thead>
            <tbody id="post-list">
            </tbody>
        </table>
    </div>
</div>


<script>
    function createPost() {
        const userId = $('#create-user-id').val();
        const title = $('#create-title').val();
        const content = $('#create-content').val();
        const data = { title, content };

        $.ajax({
            url: `/api/post/create/${userId}`,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                alert(response);
            },
            error: function(error) {
                alert('Error creating post: ' + error.responseText);
            }
        });
    }

    function viewPost() {
        const postId = $('#view-post-id').val();

        $.ajax({
            url: `/api/post/detail/${postId}`,
            method: 'GET',
            success: function(response) {
                if (response) {
                    $('#post-detail').html(`
                    <h5>Post Details:</h5>
                    <p><strong>Title:</strong> ${response.title}</p>
                    <p><strong>Content:</strong> ${response.content}</p>
                `);
                    $('#like-section').show();
                    $('#like-count').text(`Likes: ${response.likeCount}`);
                } else {
                    $('#post-detail').html('<p class="text-danger">Post not found.</p>');
                    $('#like-section').hide();
                }
            },
            error: function(error) {
                $('#post-detail').html('<p class="text-danger">Post not found.</p>');
                $('#like-section').hide();
            }
        });
    }


    function updatePost() {
        const userId = $('#update-user-id').val();
        const postId = $('#update-post-id').val();
        const title = $('#update-title').val();
        const content = $('#update-content').val();
        const data = { postId, title, content };

        $.ajax({
            url: `/api/post/update/${userId}`,
            method: 'PATCH',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                alert(response);
            },
            error: function(error) {
                alert('Error updating post: ' + error.responseText);
            }
        });
    }
    function deletePost() {
        const userId = $('#delete-user-id').val();
        const postId = $('#delete-post-id').val();
        const data = { postId };

        $.ajax({
            url: `/api/post/delete/${userId}`,
            method: 'DELETE',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                alert(response);
            },
            error: function(error) {
                alert('Error deleting post: ' + error.responseText);
            }
        });
    }
    function likePost() {
        const postId = $('#view-post-id').val();

        $.ajax({
            url: `/api/post/like/${postId}`,
            method: 'POST',
            success: function(response) {
                $('#like-count').text(`Likes: ${response}`);
            },
            error: function(error) {
                alert('Error liking post: ' + error.responseText);
            }
        });
    }
    function fetchPostList() {
        $.ajax({
            url: '/api/post/list',
            method: 'GET',
            success: function(response) {
                const postList = response.map(post => `
                <tr>
                    <td>${post.postId}</td>
                    <td>${post.title}</td>
                    <td>${post.content}</td>
                    <td>${post.likeCount}</td>
                </tr>
            `).join('');
                $('#post-list').html(postList);
            },
            error: function(error) {
                alert('Error fetching posts: ' + error.responseText);
            }
        });
    }

    function navigateToUserPage() {
        window.location.href = '/user';
    }
</script>
</body>
</html>
